<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveling - Divisor de Gastos</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lucas02-pixel/Planner-de-Viagem-Pro/refs/heads/main/Traveling.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-indigo-950 text-white shadow-md p-4 mb-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-calculator text-teal-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Traveling <span class="text-teal-400 font-normal">| Divisor de Gastos</span></h1>
            </div>
            <a href="hub.html" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Hub
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-12 grid grid-cols-1 md:grid-cols-3 gap-6">

        <div class="md:col-span-1 space-y-4">
            <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 class="text-base font-bold text-indigo-950 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-teal-600"></i> Adicionar Despesa
                </h2>

                <form id="formGasto" onsubmit="adicionarGasto(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição</label>
                        <input type="text" id="descricao" required placeholder="Ex: Jantar, Uber, Mercado" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-teal-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Valor Total (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="150.00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-teal-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Quem pagou?</label>
                        <input type="text" id="pagador" required placeholder="Ex: Lucas" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-teal-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Dividir entre quem? (separados por vírgula)</label>
                        <input type="text" id="participantes" required placeholder="Ex: Lucas, Ana, Carlos" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-teal-500">
                    </div>

                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-lg text-sm transition shadow mt-2">
                        Adicionar Despesa
                    </button>
                </form>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">

            <div class="bg-indigo-950 text-white rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-teal-400 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-scale-balanced"></i> Acerto de Contas
                </h2>
                <div id="resumoBalanco" class="space-y-2 text-sm text-slate-200">
                    <p class="text-xs text-slate-400">Adicione despesas para ver o cálculo automático de acerto entre os viajantes.</p>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold text-indigo-950 flex items-center gap-2">
                        <i class="fa-solid fa-receipt text-teal-600"></i> Histórico de Despesas
                    </h3>
                    <button onclick="limparGastos()" class="text-xs text-red-500 hover:underline">Limpar tudo</button>
                </div>

                <div id="listaGastos" class="space-y-3">
                    </div>
            </div>

        </div>

    </main>

    <script>
        let gastos = JSON.parse(localStorage.getItem('traveling_divisor') || '[]');

        function guardarESincronizar() {
            localStorage.setItem('traveling_divisor', JSON.stringify(gastos));
            renderizar();
        }

        function adicionarGasto(e) {
            e.preventDefault();
            const desc = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value) || 0;
            const pagador = document.getElementById('pagador').value.trim();
            const partBruto = document.getElementById('participantes').value;
            
            const participantes = partBruto.split(',').map(p => p.trim()).filter(p => p.length > 0);

            if (participantes.length === 0) {
                alert("Digite ao menos um participante.");
                return;
            }

            const novoGasto = {
                id: Date.now(),
                descricao: desc,
                valor: valor,
                pagador: pagador,
                participantes: participantes
            };

            gastos.push(novoGasto);
            guardarESincronizar();
            e.target.reset();
        }

        function removerGasto(id) {
            gastos = gastos.filter(g => g.id !== id);
            guardarESincronizar();
        }

        function limparGastos() {
            if (confirm("Tem certeza que deseja apagar todas as despesas?")) {
                gastos = [];
                guardarESincronizar();
            }
        }

        function calcularBalanco() {
            const saldos = {}; // { pessoa: saldoNet }

            gastos.forEach(g => {
                const valorPorPessoa = g.valor / g.participantes.length;

                // Credita quem pagou
                saldos[g.pagador] = (saldos[g.pagador] || 0) + g.valor;

                // Debita de quem consumiu
                g.participantes.forEach(p => {
                    saldos[p] = (saldos[p] || 0) - valorPorPessoa;
                });
            });

            return saldos;
        }

        function renderizar() {
            const containerLista = document.getElementById('listaGastos');
            const containerBalanco = document.getElementById('resumoBalanco');

            // Renderiza Lista
            if (gastos.length === 0) {
                containerLista.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Nenhuma despesa cadastrada ainda.</p>`;
                containerBalanco.innerHTML = `<p class="text-xs text-slate-400">Adicione despesas para calcular quem deve quanto.</p>`;
                return;
            }

            let htmlLista = '';
            gastos.forEach(g => {
                htmlLista += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs">
                        <div>
                            <p class="font-bold text-slate-800 text-sm">${g.descricao}</p>
                            <p class="text-slate-500">Pagador: <span class="font-semibold text-teal-600">${g.pagador}</span> | Dividido com: ${g.participantes.join(', ')}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-slate-800 text-sm">R$ ${g.valor.toFixed(2)}</span>
                            <button onclick="removerGasto(${g.id})" class="text-slate-300 hover:text-red-500 text-sm"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                `;
            });
            containerLista.innerHTML = htmlLista;

            // Renderiza Balanço
            const saldos = calcularBalanco();
            let htmlBalanco = '<ul class="space-y-1.5 text-xs">';
            
            Object.keys(saldos).forEach(pessoa => {
                const saldo = saldos[pessoa];
                if (Math.abs(saldo) < 0.01) {
                    htmlBalanco += `<li class="flex justify-between border-b border-indigo-900/50 pb-1"><span>${pessoa}:</span> <span class="text-slate-400">Conta zerada!</span></li>`;
                } else if (saldo > 0) {
                    htmlBalanco += `<li class="flex justify-between border-b border-indigo-900/50 pb-1"><span>${pessoa}:</span> <span class="text-emerald-400 font-bold">Tem a receber R$ ${saldo.toFixed(2)}</span></li>`;
                } else {
                    htmlBalanco += `<li class="flex justify-between border-b border-indigo-900/50 pb-1"><span>${pessoa}:</span> <span class="text-rose-400 font-bold">Deve R$ ${Math.abs(saldo).toFixed(2)}</span></li>`;
                }
            });
            htmlBalanco += '</ul>';
            containerBalanco.innerHTML = htmlBalanco;
        }

        renderizar();
    </script>
</body>
</html>
