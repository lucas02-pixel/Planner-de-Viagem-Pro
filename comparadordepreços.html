<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveling - Comparador Inteligente</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lucas02-pixel/Planner-de-Viagem-Pro/refs/heads/main/Traveling.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-indigo-950 text-white shadow-md p-4 mb-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-scale-balanced text-amber-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Traveling <span class="text-amber-400 font-normal">| Comparador</span></h1>
            </div>
            <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Planner
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pb-12">

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-8">
            <h2 class="text-lg font-bold text-indigo-950 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-indigo-600"></i> Adicionar Opção para Comparar
            </h2>

            <form id="formComparador" onsubmit="adicionarOpcao(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nome da Opção</label>
                    <input type="text" id="nome" required placeholder="Ex: Hotel Beira Mar" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria</label>
                    <select id="categoria" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Hospedagem">🏨 Hospedagem</option>
                        <option value="Voo">✈️ Voo / Passagem</option>
                        <option value="Passeio">🎟️ Passeio / Atração</option>
                        <option value="Carro">🚗 Aluguel de Carro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Preço Base (R$)</label>
                    <input type="number" step="0.01" id="precoBase" required placeholder="1000.00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Taxas / Extras (R$)</label>
                    <input type="number" step="0.01" id="taxas" placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Avaliação / Estrelas (0 a 5)</label>
                    <input type="number" min="1" max="5" step="0.1" id="nota" required placeholder="Ex: 4.8" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Link (Opcional)</label>
                    <input type="url" id="link" placeholder="https://..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="md:col-span-3 flex flex-wrap gap-4 pt-2 border-t border-slate-100">
                    <span class="text-xs font-semibold text-slate-600">Diferenciais:</span>
                    <label class="text-xs flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="cafe" class="rounded text-indigo-600"> Inclui Café da Manhã
                    </label>
                    <label class="text-xs flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="cancelamento" class="rounded text-indigo-600"> Cancelamento Grátis
                    </label>
                    <label class="text-xs flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="localizacao" class="rounded text-indigo-600"> Ótima Localização
                    </label>
                </div>

                <div class="md:col-span-3 flex justify-end mt-2">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-lg text-sm transition shadow flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Adicionar para Comparar
                    </button>
                </div>
            </form>
        </div>

        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Comparativo de Opções
                </h2>
                <button onclick="limparTudo()" class="text-xs text-red-500 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-trash"></i> Limpar tudo
                </button>
            </div>

            <div id="containerOpcoes" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                </div>
        </div>

    </main>

    <script>
        let opcoes = JSON.parse(localStorage.getItem('traveling_comparador') || '[]');

        function guardarESincronizar() {
            localStorage.setItem('traveling_comparador', JSON.stringify(opcoes));
            renderizar();
        }

        function adicionarOpcao(e) {
            e.preventDefault();
            const novaOpcao = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                precoBase: parseFloat(document.getElementById('precoBase').value) || 0,
                taxas: parseFloat(document.getElementById('taxas').value) || 0,
                nota: parseFloat(document.getElementById('nota').value) || 0,
                link: document.getElementById('link').value || '#',
                cafe: document.getElementById('cafe').checked,
                cancelamento: document.getElementById('cancelamento').checked,
                localizacao: document.getElementById('localizacao').checked
            };

            opcoes.push(novaOpcao);
            guardarESincronizar();
            e.target.reset();
        }

        function removerOpcao(id) {
            opcoes = opcoes.filter(item => item.id !== id);
            guardarESincronizar();
        }

        function limparTudo() {
            if (confirm("Deseja apagar todas as comparações?")) {
                opcoes = [];
                guardarESincronizar();
            }
        }

        function calcularScore(item) {
            const precoTotal = item.precoBase + item.taxas;
            let score = item.nota * 20; // Nota de 0 a 100
            
            if (item.cafe) score += 10;
            if (item.cancelamento) score += 10;
            if (item.localizacao) score += 10;

            // Penaliza preços muito altos em relação ao score
            score = score - (precoTotal / 100);
            return score;
        }

        function renderizar() {
            const container = document.getElementById('containerOpcoes');
            if (opcoes.length === 0) {
                container.innerHTML = `
                    <div class="col-span-3 text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 text-slate-400">
                        <i class="fa-solid fa-scale-balanced text-4xl mb-2 text-slate-300"></i>
                        <p class="text-sm">Nenhuma opção adicionada ainda.</p>
                    </div>
                `;
                return;
            }

            // Acha o mais barato e o melhor custo-benefício
            const menorPreco = Math.min(...opcoes.map(o => o.precoBase + o.taxas));
            const maiorScore = Math.max(...opcoes.map(o => calcularScore(o)));

            let html = '';
            opcoes.forEach(item => {
                const total = item.precoBase + item.taxas;
                const score = calcularScore(item);
                
                const eMaisBarato = total === menorPreco && opcoes.length > 1;
                const eMelhorCustoBeneficio = score === maiorScore && opcoes.length > 1;

                html += `
                    <div class="bg-white rounded-xl border ${eMelhorCustoBeneficio ? 'border-amber-500 ring-2 ring-amber-500/20' : eMaisBarato ? 'border-emerald-500' : 'border-slate-200'} shadow-sm p-5 relative flex flex-col justify-between transition">
                        
                        ${eMelhorCustoBeneficio ? `
                            <span class="absolute -top-3 left-4 bg-amber-500 text-indigo-950 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1 shadow">
                                <i class="fa-solid fa-crown"></i> Melhor Custo-Benefício
                            </span>
                        ` : eMaisBarato ? `
                            <span class="absolute -top-3 left-4 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                                <i class="fa-solid fa-tag"></i> Mais Barato
                            </span>
                        ` : ''}

                        <div>
                            <div class="flex justify-between items-start mb-2 mt-1">
                                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${item.categoria}</span>
                                <button onclick="removerOpcao(${item.id})" class="text-slate-300 hover:text-red-500 transition text-sm">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <h3 class="font-bold text-indigo-950 text-base mb-1">${item.nome}</h3>
                            
                            <div class="flex items-center gap-1 mb-3 text-xs font-bold text-amber-500">
                                <i class="fa-solid fa-star"></i> ${item.nota.toFixed(1)} / 5.0
                            </div>

                            <div class="flex flex-wrap gap-1.5 mb-4">
                                ${item.cafe ? '<span class="text-[10px] bg-emerald-50 text-emerald-700 font-semibold px-2 py-0.5 rounded">☕ Café da manhã</span>' : ''}
                                ${item.cancelamento ? '<span class="text-[10px] bg-blue-50 text-blue-700 font-semibold px-2 py-0.5 rounded">🛡️ Cancelamento grátis</span>' : ''}
                                ${item.localizacao ? '<span class="text-[10px] bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded">📍 Boa localização</span>' : ''}
                            </div>

                            <div class="space-y-1 text-xs border-t border-slate-100 pt-3 text-slate-600">
                                <div class="flex justify-between">
                                    <span>Preço base:</span>
                                    <span>R$ ${item.precoBase.toFixed(2)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Taxas / Extras:</span>
                                    <span>R$ ${item.taxas.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-slate-100 pt-3 mt-4">
                            <div class="flex justify-between items-baseline mb-3">
                                <span class="text-xs font-bold text-slate-500 uppercase">Total Real:</span>
                                <span class="text-xl font-extrabold ${eMelhorCustoBeneficio ? 'text-amber-600' : 'text-indigo-950'}">
                                    R$ ${total.toFixed(2)}
                                </span>
                            </div>

                            ${item.link !== '#' ? `
                                <a href="${item.link}" target="_blank" class="block w-full text-center bg-slate-100 hover:bg-indigo-50 text-indigo-600 text-xs font-bold py-2 rounded-lg transition">
                                    Ver no Site <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        renderizar();
    </script>
</body>
</html>
